<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranen Admin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #080a0f; --panel: #0e1119; --card: #151a26; --line: rgba(255,255,255,.08);
    --text: #e9eef5; --muted: #8b97ab; --accent: #14b8a6; --gold: #d4af37; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex;
    align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.05rem; margin: 0; color: var(--gold); letter-spacing: .2px; }
  header .who { color: var(--muted); font-size: .78rem; margin-left: auto; }
  nav { display: flex; gap: 4px; }
  nav button, .btn { background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; font-size: .8rem; cursor: pointer; }
  nav button.on { color: var(--text); background: var(--card); border-color: var(--accent); }
  .btn:hover, nav button:hover { color: var(--text); }
  .btn.danger { color: var(--danger); border-color: rgba(248,113,113,.35); }
  main { max-width: 980px; margin: 0 auto; padding: 18px 14px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat b { display: block; font-size: 1.6rem; }
  .stat span { color: var(--muted); font-size: .75rem; }
  .note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: .8rem;
    background: rgba(212,175,55,.08); border: 1px solid rgba(212,175,55,.3); color: #f3e3a3; }
  h2 { font-size: .95rem; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: .72rem; color: var(--muted); margin-top: 2px; }
  .pill { font-size: .65rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .pill.acc { color: var(--accent); border-color: rgba(20,184,166,.4); }
  .msg { border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: .84rem;
    white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
  .msg.user { background: rgba(20,184,166,.1); border: 1px solid rgba(20,184,166,.25); }
  .msg.assistant { background: var(--card); border: 1px solid var(--line); }
  .msg small { display: block; color: var(--muted); font-size: .68rem; margin-bottom: 4px; }
  .crumbs { color: var(--muted); font-size: .8rem; margin-bottom: 12px; }
  .crumbs a { color: var(--accent); cursor: pointer; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: .85rem; }
  .gate { max-width: 360px; margin: 18vh auto; text-align: center; padding: 0 20px; }
  .gate a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const app = document.getElementById('app');
const state = { view: 'overview', user: null, chat: null, identifier: null };

// Safe element builder: strings become text nodes, so chat content can never run as HTML.
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(k => { if (k != null) el.append(k); });
  return el;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts });
  if (res.status === 403 || res.status === 401) { location.href = '/admin'; throw new Error('forbidden'); }
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

function shortId(id) { return id && id.length > 26 && !id.includes('@') ? id.slice(0, 8) + '…' + id.slice(-4) : id; }

function shell(content) {
  const tab = (key, label) => h('button', {
    class: state.view === key || (key === 'users' && ['chats', 'chat'].includes(state.view)) ? 'on' : '',
    onclick: () => go(key)
  }, label);
  app.replaceChildren(
    h('header', {},
      h('h1', {}, 'Ranen Admin'),
      h('nav', {}, tab('overview', 'Overview'), tab('users', 'Users')),
      h('span', { class: 'who' }, state.user || ''),
      h('a', { class: 'btn', href: '/' }, 'Back to chat')
    ),
    h('main', {}, content)
  );
}

function go(view, extra = {}) { Object.assign(state, { view }, extra); render(); }

async function renderOverview() {
  const s = await api('/api/admin/stats');
  const stat = (n, label) => h('div', { class: 'stat' }, h('b', {}, String(n)), h('span', {}, label));
  const nodes = [
    h('div', { class: 'grid' },
      stat(s.messages_today, 'messages today'),
      stat(s.active_today, 'active today'),
      stat(s.accounts, 'signed-in accounts'),
      stat(s.guests, 'guests'),
      stat(s.total_chats, 'saved chats'),
      stat(s.total_messages, 'stored messages'))
  ];
  if (s.storage !== 'postgres') {
    nodes.push(h('div', { class: 'note' },
      'Chats are on local disk, not PostgreSQL. They will be lost on redeploy. Check DATABASE_URL on Render.'));
  }
  nodes.push(h('p', { class: 'crumbs', style: 'margin-top:14px' }, 'Daily limit per user: ' + s.daily_limit + ' messages.'));
  shell(nodes);
}

async function renderUsers() {
  const [users, stats] = await Promise.all([api('/api/admin/users'), api('/api/admin/stats')]);
  const rows = users.length ? users.map(u => h('div', { class: 'row' },
    h('div', { class: 'main' },
      h('div', { class: 't' }, shortId(u.identifier)),
      h('div', { class: 's' }, u.chats + ' chats · ' + u.messages + ' messages · ' + u.today + '/' + stats.daily_limit + ' today')),
    h('span', { class: 'pill ' + (u.is_guest ? '' : 'acc') }, u.is_guest ? 'guest' : 'account'),
    h('button', { class: 'btn', onclick: () => go('chats', { identifier: u.identifier }) }, 'Chats'),
    h('button', { class: 'btn', onclick: async () => {
      if (!confirm('Reset today\'s usage for this user?')) return;
      await api('/api/admin/reset-usage?identifier=' + encodeURIComponent(u.identifier), { method: 'POST' });
      render();
    } }, 'Reset')
  )) : [h('div', { class: 'empty' }, 'No users yet.')];
  shell([h('h2', {}, 'Users (' + users.length + ')'), ...rows]);
}

async function renderChats() {
  const chats = await api('/api/admin/chats?identifier=' + encodeURIComponent(state.identifier));
  const rows = chats.length ? chats.map(c => h('div', { class: 'row' },
    h('div', { class: 'main' },
      h('div', { class: 't' }, c.title),
      h('div', { class: 's' }, c.messages + ' messages' + (c.created_at ? ' · ' + new Date(c.created_at).toLocaleString() : ''))),
    h('button', { class: 'btn', onclick: () => go('chat', { chat: c.chat_id }) }, 'Read'),
    h('button', { class: 'btn danger', onclick: async () => {
      if (!confirm('Delete this chat permanently?')) return;
      await api('/api/admin/chat?identifier=' + encodeURIComponent(state.identifier) + '&chat_id=' + encodeURIComponent(c.chat_id), { method: 'DELETE' });
      render();
    } }, 'Delete')
  )) : [h('div', { class: 'empty' }, 'No chats for this user.')];
  shell([
    h('div', { class: 'crumbs' }, h('a', { onclick: () => go('users') }, 'Users'), ' / ' + shortId(state.identifier)),
    ...rows
  ]);
}

async function renderChat() {
  const d = await api('/api/admin/chat?identifier=' + encodeURIComponent(state.identifier) + '&chat_id=' + encodeURIComponent(state.chat));
  const msgs = d.messages.length ? d.messages.map(m => h('div', { class: 'msg ' + (m.role === 'user' ? 'user' : 'assistant') },
    h('small', {}, m.role === 'user' ? 'User' : 'Ranen'), m.content || '')) : [h('div', { class: 'empty' }, 'Empty chat.')];
  shell([
    h('div', { class: 'crumbs' }, h('a', { onclick: () => go('users') }, 'Users'), ' / ',
      h('a', { onclick: () => go('chats') }, shortId(state.identifier)), ' / ' + (d.title || 'Chat')),
    ...msgs
  ]);
}

async function render() {
  try {
    if (state.view === 'overview') await renderOverview();
    else if (state.view === 'users') await renderUsers();
    else if (state.view === 'chats') await renderChats();
    else if (state.view === 'chat') await renderChat();
  } catch (e) {
    if (e.message !== 'forbidden') shell(h('div', { class: 'empty' }, 'Could not load this view. ' + e.message));
  }
}

(async function boot() {
  try {
    const me = await api('/api/admin/me');
    if (!me.is_admin) { location.href = '/admin'; return; }
    const u = await api('/api/user');
    state.user = u.email || '';
    render();
  } catch (e) {
    app.replaceChildren(h('div', { class: 'gate' }, h('p', {}, 'Admin access only.'), h('a', { href: '/' }, 'Back to Ranen')));
  }
})();
</script>
</body>
</html>
