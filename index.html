<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fsociety AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .sidebar { background-color: #161b22; }
        .chat-container { background-color: #0d1117; }
        .artifact-panel { background-color: #161b22; border-left: 1px solid #30363d; }
        .input-box { background-color: #21262d; border: 1px solid #30363d; }
        
        /* FIXED COLORS: User is dark gray, AI is transparent/no border for a clean look */
        .user-msg { background-color: #21262d; color: #ffffff; border: 1px solid #30363d; }
        .assistant-msg { background-color: transparent; color: #c9d1d9; border: none; padding-left: 0; }
        
        .artifact-card { background-color: #21262d; border: 1px solid #30363d; transition: all 0.2s; }
        .artifact-card:hover { border-color: #58a6ff; }
        pre code { display: block; padding: 1rem; overflow-x: auto; background: #0d1117; color: #e6edf3; border-radius: 0.5rem; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar w-64 flex-shrink-0 flex flex-col justify-between p-4 border-r border-gray-800">
        <div>
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-gray-400"></i> Fsociety AI
                </h1>
                <button onclick="createNewSession()" class="text-gray-400 hover:text-white text-lg">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="session-list" class="space-y-2 overflow-y-auto max-h-[70vh]">
                <!-- Chat Sessions Render Here -->
            </div>
        </div>

        <div id="user-profile" class="border-t border-gray-800 pt-4 flex items-center justify-between">
            <span class="text-sm text-gray-400">Guest User</span>
            <a href="/auth/login" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg">Login</a>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full relative">
        <header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-[#0d1117]">
            <h2 id="current-chat-title" class="font-semibold text-gray-200">New Chat</h2>
            <div class="flex items-center gap-3">
                <button id="toggle-artifact-btn" onclick="toggleArtifactPanel()" class="hidden text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-sidebar"></i> Artifacts
                </button>
            </div>
        </header>

        <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl mx-auto w-full">
            <!-- Messages Render Here -->
        </div>

        <!-- INPUT BOX -->
        <div class="p-4 max-w-4xl mx-auto w-full">
            <form id="chat-form" onsubmit="sendMessage(event)" class="input-box rounded-xl p-3 flex flex-col gap-2 shadow-lg">
                <textarea id="user-input" rows="2" placeholder="Ask Fsociety AI..." class="bg-transparent text-white focus:outline-none resize-none w-full text-sm px-2"></textarea>
                <div class="flex items-center justify-between pt-2 border-t border-gray-800">
                    <div class="flex items-center gap-2">
                        <label for="file-upload" class="cursor-pointer text-gray-400 hover:text-white px-2 py-1 rounded text-sm">
                            <i class="fa-solid fa-paperclip"></i>
                        </label>
                        <input id="file-upload" type="file" class="hidden" onchange="handleFileSelect(event)">
                        <span id="file-name-display" class="text-xs text-gray-400"></span>
                    </div>
                    <button type="submit" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-1.5 rounded-lg text-sm flex items-center gap-2">
                        Send <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- ARTIFACT PANEL -->
    <aside id="artifact-panel" class="artifact-panel w-1/2 h-full hidden flex-col">
        <header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-[#161b22]">
            <div class="flex items-center gap-4">
                <button onclick="switchArtifactTab('code')" id="tab-code" class="text-sm font-semibold text-gray-200 border-b-2 border-gray-400 pb-1">Code</button>
                <button onclick="switchArtifactTab('preview')" id="tab-preview" class="text-sm font-semibold text-gray-500 hover:text-gray-300 pb-1">Preview</button>
            </div>
            <button onclick="toggleArtifactPanel()" class="text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>

        <div id="artifact-code-view" class="flex-1 p-4 overflow-y-auto">
            <pre><code id="artifact-code-content" class="text-sm font-mono"></code></pre>
        </div>

        <div id="artifact-preview-view" class="flex-1 hidden bg-white">
            <iframe id="artifact-preview-frame" class="w-full h-full border-none"></iframe>
        </div>
    </aside>

    <script>
        let currentSessionId = null;
        let selectedFile = null;
        let activeCodeContent = "";

        async function init() {
            await checkUser();
            await fetchSessions();
        }

        async function checkUser() {
            const res = await fetch('/api/current-user');
            const data = await res.json();
            const profileDiv = document.getElementById('user-profile');
            if (data.logged_in) {
                profileDiv.innerHTML = `
                    <div class="flex items-center gap-2">
                        <img src="${data.user.picture}" class="w-6 h-6 rounded-full">
                        <span class="text-xs text-gray-200">${data.user.name}</span>
                    </div>
                    <a href="/auth/logout" class="text-xs text-red-400 hover:underline">Logout</a>
                `;
            }
        }

        async function fetchSessions() {
            const res = await fetch('/api/sessions');
            const sessions = await res.json();
            const list = document.getElementById('session-list');
            list.innerHTML = '';
            
            if (sessions.length > 0) {
                sessions.forEach(s => {
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-2 hover:bg-gray-800 rounded-lg cursor-pointer text-sm ${currentSessionId === s.id ? 'bg-gray-800 text-white' : 'text-gray-400'}" onclick="loadSession(${s.id}, '${s.title}')">
                            <span class="truncate w-40">${s.title}</span>
                            <button onclick="deleteSession(event, ${s.id})" class="hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
                if (!currentSessionId) loadSession(sessions[0].id, sessions[0].title);
            } else {
                createNewSession();
            }
        }

        async function createNewSession() {
            const res = await fetch('/api/new-session', { method: 'POST' });
            const data = await res.json();
            currentSessionId = data.session_id;
            
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            // FIXED: Re-added the Welcome Message
            renderMessage('assistant', "Welcome to Fsociety AI. How can I help you today?");
            
            document.getElementById('current-chat-title').innerText = 'New Chat';
            fetchSessions();
        }

        async function loadSession(id, title) {
            currentSessionId = id;
            document.getElementById('current-chat-title').innerText = title;
            const res = await fetch(`/api/history/${id}`);
            const messages = await res.json();
            
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            // FIXED: Shows welcome message if chat history is empty
            if (messages.length === 0) {
                renderMessage('assistant', "Welcome to Fsociety AI. How can I help you today?");
            } else {
                messages.forEach(m => renderMessage(m.role, m.content));
            }
            
            fetchSessions();
        }

        async function deleteSession(e, id) {
            e.stopPropagation();
            await fetch(`/api/delete-session/${id}`, { method: 'DELETE' });
            if (currentSessionId === id) currentSessionId = null;
            fetchSessions();
        }

        function handleFileSelect(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('file-name-display').innerText = selectedFile.name;
            }
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedFile) return;

            renderMessage('user', text + (selectedFile ? ` [File: ${selectedFile.name}]` : ''));
            
            const formData = new FormData();
            formData.append('session_id', currentSessionId);
            formData.append('message', text);
            if (selectedFile) formData.append('file', selectedFile);

            input.value = '';
            document.getElementById('file-name-display').innerText = '';
            selectedFile = null;

            const res = await fetch('/api/chat', { method: 'POST', body: formData });
            const data = await res.json();
            renderMessage('assistant', data.response);
        }

        function renderMessage(role, content) {
            const container = document.getElementById('messages-container');
            const isUser = role === 'user';
            
            const codeBlockRegex = /```(?:html|css|javascript|js|python)?\n([\s\S]*?)```/g;
            let match = codeBlockRegex.exec(content);
            
            let artifactBtnHtml = '';
            if (!isUser && match) {
                activeCodeContent = match[1];
                artifactBtnHtml = `
                    <div class="artifact-card p-3 rounded-lg mt-3 flex items-center justify-between cursor-pointer" onclick="openArtifact()">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-code text-gray-400"></i>
                            <div>
                                <div class="text-xs font-semibold text-white">Generated Code Artifact</div>
                                <div class="text-[10px] text-gray-400">Click to view split screen & preview</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                    </div>
                `;
                document.getElementById('toggle-artifact-btn').classList.remove('hidden');
            }

            const formattedContent = marked.parse(content);
            const msgHtml = `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-2xl rounded-2xl p-4 ${isUser ? 'user-msg' : 'assistant-msg'}">
                        <div class="text-sm prose prose-invert">${formattedContent}</div>
                        ${artifactBtnHtml}
                    </div>
                </div>
            `;
            container.innerHTML += msgHtml;
            container.scrollTop = container.scrollHeight;
        }

        function openArtifact() {
            const panel = document.getElementById('artifact-panel');
            panel.classList.remove('hidden');
            panel.classList.add('flex');
            document.getElementById('artifact-code-content').innerText = activeCodeContent;
            const iframe = document.getElementById('artifact-preview-frame');
            iframe.srcdoc = activeCodeContent;
        }

        function toggleArtifactPanel() {
            const panel = document.getElementById('artifact-panel');
            panel.classList.toggle('hidden');
            panel.classList.toggle('flex');
        }

        function switchArtifactTab(tab) {
            const codeView = document.getElementById('artifact-code-view');
            const previewView = document.getElementById('artifact-preview-view');
            const codeTab = document.getElementById('tab-code');
            const previewTab = document.getElementById('tab-preview');

            if (tab === 'code') {
                codeView.classList.remove('hidden');
                previewView.classList.add('hidden');
                codeTab.className = "text-sm font-semibold text-gray-200 border-b-2 border-gray-400 pb-1";
                previewTab.className = "text-sm font-semibold text-gray-500 hover:text-gray-300 pb-1";
            } else {
                codeView.classList.add('hidden');
                previewView.classList.remove('hidden');
                previewTab.className = "text-sm font-semibold text-gray-200 border-b-2 border-gray-400 pb-1";
                codeTab.className = "text-sm font-semibold text-gray-500 hover:text-gray-300 pb-1";
            }
        }

        init();
    </script>
</body>
</html>
