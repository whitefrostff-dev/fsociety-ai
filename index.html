<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fsociety AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        .glass-panel {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .shiny-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .chip {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .chip:hover {
            background: #222;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white flex h-full w-full font-sans">

    <!-- MOBILE OVERLAY -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/80 z-40 hidden md:hidden transition-opacity"></div>

    <!-- SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#0a0a0a] border-r border-gray-800 flex flex-col transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0 h-full">
        
        <div class="p-4 flex flex-col h-full overflow-hidden">
            <div class="flex items-center justify-between mb-6 mt-2">
                <h1 class="text-xl font-bold tracking-wider text-white shiny-text flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-gray-300"></i> Fsociety
                </h1>
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <button onclick="createNewChatSession()" class="w-full bg-white text-black hover:bg-gray-200 py-3 rounded-2xl font-bold transition flex items-center justify-center gap-2 mb-6">
                <i class="fa-solid fa-plus"></i> New chat
            </button>

            <!-- Categorized Sections -->
            <div class="space-y-4 flex-1 overflow-y-auto pr-2 pb-20">
                <div>
                    <div class="text-xs uppercase text-gray-500 font-bold mb-2 flex justify-between items-center px-1">
                        My stuff <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </div>
                </div>
                <div>
                    <div class="text-xs uppercase text-gray-500 font-bold mb-2 flex justify-between items-center px-1">
                        Gems <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </div>
                </div>
                <div>
                    <div class="text-xs uppercase text-gray-500 font-bold mb-2 px-1">Chats</div>
                    <div id="sidebar-chat-list" class="space-y-1"></div>
                </div>
            </div>
        </div>
        
        <!-- Google Auth Section -->
        <div class="absolute bottom-0 w-full p-4 bg-[#0a0a0a] border-t border-gray-900">
            <div id="user-auth-section" class="text-sm px-2"></div>
        </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="flex-1 flex flex-col h-full min-w-0 relative bg-black">
        
        <div class="absolute top-4 left-4 z-10 md:hidden">
            <button onclick="toggleSidebar()" class="p-2 text-gray-300 hover:text-white">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 pb-32">
            <!-- Dynamic Content -->
        </div>

        <!-- INPUT BOX -->
        <div class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-black via-black to-transparent">
            <form id="chat-form" class="max-w-3xl mx-auto glass-panel rounded-3xl flex items-center p-2 pr-3">
                <button type="button" onclick="document.getElementById('image-input').click()" class="text-gray-400 hover:text-white p-3 transition">
                    <i class="fa-solid fa-image text-lg"></i>
                </button>
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleFileSelection(event)">

                <button type="button" onclick="document.getElementById('pdf-input').click()" class="text-gray-400 hover:text-white p-3 transition">
                    <i class="fa-solid fa-file-pdf text-lg"></i>
                </button>
                <input type="file" id="pdf-input" accept="application/pdf" class="hidden" onchange="handleFileSelection(event)">

                <input type="text" id="message-input" placeholder="Ask Fsociety..." class="flex-1 bg-transparent border-0 focus:ring-0 text-white placeholder-gray-500 px-2 text-[15px] outline-none">
                
                <button type="submit" class="bg-white text-black hover:bg-gray-200 w-10 h-10 rounded-full flex items-center justify-center transition ml-2">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </form>
            <div id="file-indicator" class="max-w-3xl mx-auto text-xs text-gray-400 mt-2 px-4 hidden"></div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const sidebarChatList = document.getElementById('sidebar-chat-list');
        const fileIndicator = document.getElementById('file-indicator');
        
        let currentSessionId = null;
        let selectedFile = null;
        let isImageMode = false;
        let userName = "Guest";

        function handleFileSelection(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                fileIndicator.textContent = `Attached: ${file.name}`;
                fileIndicator.classList.remove('hidden');
            }
        }

        async function initApp() {
            try {
                const res = await fetch('/api/current-user');
                const data = await res.json();
                const authSection = document.getElementById('user-auth-section');
                
                if (data.logged_in) {
                    userName = data.user.name.split(' ')[0];
                    authSection.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="${data.user.picture}" class="w-8 h-8 rounded-full border border-gray-700">
                                <span class="font-medium">${userName}</span>
                            </div>
                            <a href="/auth/logout" class="text-xs text-gray-500 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></a>
                        </div>`;
                } else {
                    authSection.innerHTML = `<a href="/auth/login" class="bg-[#1a1a1a] hover:bg-[#2a2a2a] text-white py-2 px-4 rounded-xl flex items-center justify-center gap-2 border border-gray-800 transition"><i class="fa-brands fa-google"></i> Sign in</a>`;
                }
            } catch (e) {}
            await loadSessions();
        }

        function renderWelcomeScreen() {
            chatContainer.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center max-w-2xl mx-auto mt-10 md:mt-0 fade-in">
                    <h1 class="text-3xl md:text-5xl font-semibold mb-2">Hi ${userName}</h1>
                    <h2 class="text-3xl md:text-5xl font-semibold text-gray-500 mb-10">Where should we start?</h2>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full px-4">
                        <button onclick="triggerChip('image')" class="chip rounded-2xl p-4 text-left flex items-center gap-3">
                            <span class="text-xl">🖼️</span>
                            <span class="font-medium">Create image</span>
                        </button>
                        <button onclick="triggerChip('write')" class="chip rounded-2xl p-4 text-left flex items-center gap-3">
                            <span class="text-xl">📄</span>
                            <span class="font-medium">Write anything</span>
                        </button>
                        <button onclick="triggerChip('boost')" class="chip rounded-2xl p-4 text-left flex items-center gap-3">
                            <span class="text-xl">✨</span>
                            <span class="font-medium">Boost my day</span>
                        </button>
                        <button onclick="triggerChip('music')" class="chip rounded-2xl p-4 text-left flex items-center gap-3">
                            <span class="text-xl">🎸</span>
                            <span class="font-medium">Create music</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function triggerChip(type) {
            if(type === 'image') {
                isImageMode = true;
                messageInput.placeholder = "Describe the image you want to create...";
                messageInput.focus();
            } else if(type === 'write') {
                messageInput.value = "Write a creative story about...";
                messageInput.focus();
            } else if(type === 'boost') {
                submitDirectMessage("Give me a motivational quote to boost my day.");
            } else if(type === 'music') {
                submitDirectMessage("Write a catchy chorus for a rock song.");
            }
        }

        async function loadSessions() {
            const res = await fetch('/api/sessions');
            const sessions = await res.json();
            sidebarChatList.innerHTML = '';
            
            if (sessions.length > 0) {
                sessions.forEach(s => {
                    const div = document.createElement('div');
                    div.className = `p-3 rounded-xl cursor-pointer truncate transition text-sm ${s.id === currentSessionId ? 'bg-[#1a1a1a] text-white font-medium border border-gray-800' : 'text-gray-400 hover:bg-[#111] hover:text-gray-200'}`;
                    div.textContent = s.title;
                    div.onclick = () => switchSession(s.id);
                    sidebarChatList.appendChild(div);
                });
                if (!currentSessionId) switchSession(sessions[0].id);
            } else {
                createNewChatSession();
            }
        }

        async function createNewChatSession() {
            const res = await fetch('/api/new-session', { method: 'POST' });
            const data = await res.json();
            currentSessionId = data.session_id;
            isImageMode = false;
            messageInput.placeholder = "Ask Fsociety...";
            renderWelcomeScreen();
            loadSessions();
        }

        async function switchSession(sessionId) {
            currentSessionId = sessionId;
            isImageMode = false;
            messageInput.placeholder = "Ask Fsociety...";
            const res = await fetch(`/api/history/${sessionId}`);
            const history = await res.json();
            
            chatContainer.innerHTML = '';
            if (history.length > 0) {
                history.forEach(msg => appendMessage(msg.role, msg.content));
            } else {
                renderWelcomeScreen();
            }
            loadSessions();
        }

        function appendMessage(role, content) {
            if (chatContainer.querySelector('.fade-in')) chatContainer.innerHTML = '';
            const isUser = role === 'user';
            const div = document.createElement('div');
            div.className = `flex mb-6 ${isUser ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[85%] sm:max-w-2xl px-5 py-3.5 text-[15px] leading-relaxed ${isUser ? 'bg-[#2a2a2a] text-white rounded-3xl rounded-br-sm' : 'text-gray-200'}">${content}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function submitDirectMessage(text) {
            if (!currentSessionId) return;
            appendMessage('user', text);
            const fd = new FormData();
            fd.append('session_id', currentSessionId);
            fd.append('message', text);
            
            const endpoint = isImageMode ? '/api/generate-image' : '/api/chat';
            isImageMode = false; 
            messageInput.placeholder = "Ask Fsociety...";
            
            const res = await fetch(endpoint, { method: 'POST', body: fd });
            const data = await res.json();
            appendMessage('assistant', data.response);
            loadSessions();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if ((!text && !selectedFile) || !currentSessionId) return;
            
            messageInput.value = '';
            let displayTxt = text;
            if (selectedFile) displayTxt += ` [Attached: ${selectedFile.name}]`;
            appendMessage('user', displayTxt);

            const fd = new FormData();
            fd.append('session_id', currentSessionId);
            fd.append('message', text);
            if (selectedFile) fd.append('file', selectedFile);

            selectedFile = null;
            fileIndicator.classList.add('hidden');
            
            const endpoint = isImageMode ? '/api/generate-image' : '/api/chat';
            isImageMode = false;
            messageInput.placeholder = "Ask Fsociety...";

            const res = await fetch(endpoint, { method: 'POST', body: fd });
            const data = await res.json();
            appendMessage('assistant', data.response);
            loadSessions();
        });

        initApp();
    </script>
</body>
    </html>
